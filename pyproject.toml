[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ulai-agents"
version = "0.1.0"
description = "Build voice agents on the Ulai agent server."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "ulai-agent-protocol>=0.1.0,<0.2",
  "grpcio>=1.85.1",
  "protobuf>=7.35.1,<8",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: AsyncIO",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ulaidotin/agent-sdk-python"
Source = "https://github.com/ulaidotin/agent-sdk-python"
Issues = "https://github.com/ulaidotin/agent-sdk-python/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ulai_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
